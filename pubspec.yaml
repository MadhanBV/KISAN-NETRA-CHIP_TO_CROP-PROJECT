name: chip_to_crop
description: "CHIP TO CROP – AI-powered agricultural mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  camera_android: ^0.10.10+2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.1
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
